<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El Gaturro en vivo</title>
<style>
  /* El Gaturro de pantalla del juego, en un marco de la interfaz (js/gaturro_vivo.js). El fondo es el del marco. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* En el escenario del preview.swf el Gaturro queda chico y algo abajo del centro: se acerca y se sube. Se agranda
     el reproductor (no se estira con `transform`) para que Ruffle lo dibuje nítido a ese tamaño. */
  ruffle-player { --veces: calc(1.8 * var(--zoom, 1)); position: absolute; width: calc(100% * var(--veces)); height: calc(100% * var(--veces));
    left: calc(50% - 50% * var(--veces)); top: calc(50% - 56% * var(--veces)); }
</style>
</head>
<body>
<script>
  // Lo maneja la interfaz con mensajes: {vestir: {partes, colores, emote}} (lo de `Nucleo.gaturro_en_vivo`) y
  // {zoom: número}. Avisa {listo: true} cuando el Gaturro ya se puede vestir, o {error: "…"} si no se pudo abrir.
  window.RufflePlayer = { config: {
    publicPath: "/ruffle/", polyfills: false, wmode: "transparent", allowScriptAccess: true, autoplay: "on",
    contextMenu: "off", splashScreen: false, unmuteOverlay: "hidden", letterbox: "on", logLevel: "warn",
  } };
  const avisar = (mensaje) => parent.postMessage(mensaje, "*");
  let player = null;
  let pendiente = null; // lo último que se pidió vestir antes de que el Gaturro estuviera listo

  addEventListener("message", (evento) => {
    const { vestir, zoom } = evento.data ?? {};
    if (zoom) document.documentElement.style.setProperty("--zoom", String(zoom));
    if (!vestir) return;
    if (player) player.mgVestir(JSON.stringify(vestir));
    else pendiente = vestir;
  });

  async function abrir() {
    await new Promise((listo, fallo) => {
      const ruffle = Object.assign(document.createElement("script"), { src: "/ruffle/ruffle.js", onload: listo });
      ruffle.onerror = () => fallo(new Error("falta Ruffle"));
      document.head.append(ruffle);
    });
    const nuevo = window.RufflePlayer.newest().createPlayer();
    document.body.append(nuevo);
    await nuevo.load({ url: "/preview.swf" });
    // El preview.swf registra `mgVestir` al arrancar (scripts/parchear_preview.py).
    for (let i = 0; i < 150 && typeof nuevo.mgVestir !== "function"; i++) await new Promise((r) => setTimeout(r, 80));
    if (typeof nuevo.mgVestir !== "function") throw new Error("el Gaturro no arrancó");
    player = nuevo;
    if (pendiente) player.mgVestir(JSON.stringify(pendiente));
    avisar({ listo: true });
  }
  abrir().catch((e) => avisar({ error: String(e.message ?? e) }));
</script>
</body>
</html>
