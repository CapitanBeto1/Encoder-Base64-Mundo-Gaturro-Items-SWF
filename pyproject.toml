[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mgitems"
version = "0.1.0"
description = "Agregar Items, trucar Prendas y armar Looks en Mundo Gaturro, solo con clics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pywebview>=6.0", "numpy>=2.0", "pillow>=11.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]
# Para «Buscar por imagen». Aparte porque no hay onnxruntime para todos los Python (32 bits, versiones muy nuevas,
# Windows en ARM): sin él, el resto del programa funciona igual.
imagen = ["onnxruntime>=1.20"]
indice = ["scikit-learn>=1.5"]  # para scripts/armar_indice.py
busqueda = ["torch>=2.5", "open-clip-torch>=3.0", "onnx>=1.17", "onnxscript", "resvg-py>=0.2", "scipy>=1.13"]  # para scripts/armar_busqueda.py

[project.gui-scripts]
mgitems = "mgitems.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mgitems = ["ui/*", "ui/css/*", "ui/fuentes/*", "ui/js/*", "datos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
