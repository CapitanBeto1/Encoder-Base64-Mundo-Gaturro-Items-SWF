[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mgitems"
version = "0.1.0"
description = "Agregar Items, trucar Prendas y armar Looks en Mundo Gaturro, solo con clics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pywebview>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
mgitems = "mgitems.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mgitems = ["ui/*", "ui/fuentes/*", "datos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
