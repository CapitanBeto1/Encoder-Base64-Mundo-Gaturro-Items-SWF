<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El Gaturro en vivo</title>
<style>
  /* El Gaturro del juego, en un marco de la interfaz (js/gaturro_vivo.js). El fondo es el del marco. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* El zoom agranda el reproductor (no lo estira con `transform`: Ruffle lo dibuja nítido a ese tamaño) alrededor
     de los pies del Gaturro, que el SWF pone en el medio, al 80% del alto (scripts/gaturro_en_vivo/MMO.as). */
  ruffle-player { position: absolute; width: calc(100% * var(--zoom, 1)); height: calc(100% * var(--zoom, 1));
    left: calc(50% - 50% * var(--zoom, 1)); top: calc(80% - 80% * var(--zoom, 1)); }
</style>
</head>
<body>
<script>
  // Lo maneja la interfaz con mensajes: {vestir: atributos} (los de `Nucleo.gaturro_en_vivo`), {zoom: número} y
  // {repetir: true} (la acción, desde el principio). Avisa {listo: true} cuando el Gaturro ya se puede vestir, o
  // {error: "…"} si no se pudo abrir. Con {foto: número, vestir}, lo viste, espera a que lleguen sus Piezas y
  // contesta {foto: número, imagen: "data:image/png…"}; para eso la página se abre con «?fotos» (dibuja en un
  // lienzo del que se puede leer la imagen).
  // Con {editar: {piezas, atributos, colores}} abre el editor de Piezas del juego (scripts/gaturro_en_vivo/MMO.as) y
  // avisa {editor: "abierto", partes: [las que muestra]}, {editor: "guardado", piezas: {parte: valor}} (las que quedaron),
  // {editor: "cancelado"} (✗ o Escape, como en el juego), {editor: "error"} y {coloresGuardados: "…"} (los que el
  // jugador guarda con «+»).
  // Con {personalizar: {atributos, piezas, colores, capas}} abre el menú de personalizar del juego: avisa
  // {personalizar: "abierto"} cuando se ve, {editor: "sin piezas"} si se eligió «Customiza tu ropa» sin Piezas, y
  // {capas: {parte: valor}} cuando «Configura tus accesorios» guardó algo; el editor avisa como arriba, y
  // {editor: "cancelado"} es también salir del menú.
  window.RufflePlayer = { config: {
    publicPath: "/ruffle/", polyfills: false, wmode: "transparent", allowScriptAccess: true, autoplay: "on",
    contextMenu: "off", splashScreen: false, unmuteOverlay: "hidden", letterbox: "on", logLevel: "warn",
    ...(location.search.includes("fotos") ? { preferredRenderer: "canvas" } : {}),
  } };
  const avisar = (mensaje) => parent.postMessage(mensaje, "*");
  // Lo que llama el SWF del editor (ExternalInterface).
  let editando = false;
  window.mgEditorAbierto = (json) => { editando = true; avisar({ editor: "abierto", partes: JSON.parse(json) }); };
  window.mgEditado = (json) => { editando = false; avisar({ editor: "guardado", piezas: JSON.parse(json) }); };
  window.mgEditorCerrado = () => { editando = false; avisar({ editor: "cancelado" }); };
  addEventListener("keydown", (e) => { if (e.key === "Escape" && editando) window.mgEditorCerrado(); });
  window.mgEditorError = (texto) => avisar({ editor: "error", error: texto });
  window.mgColoresGuardados = (colores) => avisar({ coloresGuardados: colores });
  window.mgPersonalizarAbierto = () => { editando = true; avisar({ personalizar: "abierto" }); };
  window.mgSinPiezas = () => avisar({ editor: "sin piezas" });
  window.mgCapas = (json) => { editando = false; avisar({ capas: JSON.parse(json) }); };
  let player = null;
  let pendiente = null; // lo último que se pidió vestir antes de que el Gaturro estuviera listo

  addEventListener("message", (evento) => {
    const { vestir, zoom, repetir, foto, editar, personalizar } = evento.data ?? {};
    if (zoom) document.documentElement.style.setProperty("--zoom", String(zoom));
    if (repetir) player?.mgRepetir();
    if (editar) return void player?.mgEditar(JSON.stringify(editar));
    if (personalizar) return void player?.mgPersonalizar(JSON.stringify(personalizar));
    if (foto) return void fotografiar(foto, vestir);
    if (!vestir) return;
    if (player) player.mgVestir(JSON.stringify(vestir));
    else pendiente = vestir;
  });

  const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

  async function fotografiar(foto, vestir) {
    player.mgVestir(JSON.stringify(vestir));
    // Las Piezas llegan de a una; después, un par de cuadros para que queden dibujadas.
    for (let i = 0; i < 100 && !(i > 1 && player.mgCargado()); i++) await esperar(50);
    await esperar(150);
    avisar({ foto, imagen: player.shadowRoot.querySelector("canvas")?.toDataURL("image/png") ?? null });
  }

  async function abrir() {
    await new Promise((listo, fallo) => {
      const ruffle = Object.assign(document.createElement("script"), { src: "/ruffle/ruffle.js", onload: listo });
      ruffle.onerror = () => fallo(new Error("falta Ruffle"));
      document.head.append(ruffle);
    });
    const nuevo = window.RufflePlayer.newest().createPlayer();
    document.body.append(nuevo);
    await nuevo.load({ url: "/gaturro.swf" });
    // El SWF registra `mgVestir` al arrancar (scripts/gaturro_en_vivo/MMO.as).
    for (let i = 0; i < 150 && typeof nuevo.mgVestir !== "function"; i++) await new Promise((r) => setTimeout(r, 80));
    if (typeof nuevo.mgVestir !== "function") throw new Error("el Gaturro no arrancó");
    player = nuevo;
    if (pendiente) player.mgVestir(JSON.stringify(pendiente));
    avisar({ listo: true });
  }
  abrir().catch((e) => avisar({ error: String(e.message ?? e) }));
</script>
</body>
</html>
